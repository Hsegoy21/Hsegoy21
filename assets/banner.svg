    <stop offset="1" stop-color="#7a3f52"/>
  </linearGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#f5a623" stop-opacity=".55"/>
