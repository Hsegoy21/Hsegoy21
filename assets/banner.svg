  .sun { animation: rise 6s ease-out both; }
  @keyframes rise { from { transform: translateY(60px); opacity:0 } to { transform:none; opacity:1 } }
  .name { font: 700 54px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill:#fff; letter-spacing:.5px; animation: up 1.2s ease-out both; }
  .ne { font: 500 24px 'Kohinoor Devanagari', 'Nirmala UI', 'Noto Sans Devanagari', sans-serif; fill:#f5a623; animation: up 1.2s .3s ease-out both; }
  @keyframes up { from { transform: translateY(14px); opacity:0 } to { transform:none; opacity:1 } }
  .role { font: 500 20px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill:#c9cde6; opacity:0; animation: role 12s infinite; }
  @keyframes role { 0% { opacity:0; transform:translateY(8px) } 3%,22% { opacity:1; transform:none }
                     25%,100% { opacity:0; transform:translateY(-8px) } }
  .flag { animation: wave 2.4s ease-in-out infinite; transform-origin: 0 0; }
  @keyframes wave { 0%,100% { transform: skewY(0) } 50% { transform: skewY(6deg) } }
</style>
